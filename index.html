<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Balance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFEAE0;
    --paper-2: #E6E0D2;
    --ink: #2B2A24;
    --ink-soft: #5A5748;
    --moss: #5B6E4F;
    --moss-soft: #E3E8DC;
    --ochre: #B9822F;
    --ochre-soft: #F3E6CE;
    --brick: #9C4A3B;
    --brick-soft: #F1DFDA;
    --teal: #2F6E63;
    --teal-soft: #DEEAE7;
    --line: rgba(43,42,36,0.14);
    --shadow: 0 2px 10px rgba(43,42,36,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  input, select, textarea{ font-size: 16px !important; } /* evita zoom automático do iOS ao focar campos */
  input[type="checkbox"]{
    -webkit-appearance: none; appearance: none;
    width: 19px; height: 19px; min-width: 19px; flex-shrink: 0;
    border: 1.5px solid var(--line); border-radius: 5px;
    background: #fff; cursor: pointer; position: relative;
    margin: 0; vertical-align: middle;
  }
  input[type="checkbox"]:checked{ background: var(--teal); border-color: var(--teal); }
  input[type="checkbox"]:checked::after{
    content: ''; position: absolute; left: 6px; top: 2px;
    width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(91,110,79,0.05) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(156,74,59,0.04) 0, transparent 50%),
      repeating-radial-gradient(circle at 50% 0%, transparent 0, transparent 60px, rgba(43,42,36,0.025) 61px),
      var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 780px; margin: 0 auto; }

  header{ margin-bottom: 22px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub{ color: var(--ink-soft); font-size: 14.5px; margin: 0; max-width: 54ch; }

  /* ---- Trail nav ---- */
  .trail{ position: relative; margin: 30px 0 24px; }
  .trail-path{
    position: absolute;
    top: 17px; left: 22px; right: 22px;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
    z-index: 0;
  }
  .trail-row{
    display:flex; justify-content: space-between; position: relative; z-index: 1;
  }
  .waypoint{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    background:none; border:none; cursor:pointer; padding:0; flex: 1;
    font-family: inherit;
  }
  .dot{
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--paper-2);
    border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    transition: all .15s ease;
  }
  .dot.status-verde{ background: var(--moss); border-color: var(--moss); color: #fff; }
  .dot.status-amarelo{ background: var(--ochre); border-color: var(--ochre); color: #fff; }
  .dot.status-vermelho{ background: var(--brick); border-color: var(--brick); color: #fff; }
  .waypoint.active .dot{ box-shadow: 0 0 0 4px rgba(47,110,99,0.15); border-color: var(--teal); }
  .waypoint .label{ font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .waypoint.active .label{ color: var(--ink); font-weight: 600; }
  .waypoint .today-mark{ font-size: 9px; font-family:'IBM Plex Mono', monospace; color: var(--teal); letter-spacing: 0.08em; }

  .tabs-secondary{ display:flex; gap: 8px; margin-bottom: 22px; }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em;
    padding: 10px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); cursor:pointer; line-height:1.3;
  }
  .tab-btn.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- Card ---- */
  .card{
    background: #fff; border-radius: 14px; box-shadow: var(--shadow);
    padding: 24px 26px; border: 1px solid var(--line);
  }
  .card-head{ display:flex; justify-content: space-between; align-items:flex-start; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
  .card-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.1em; margin:0 0 4px; }
  .card-title{ font-family:'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 0; }
  .card-focus{ color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; }

  .segctl{ display:flex; gap: 8px; margin: 18px 0 4px; flex-wrap: wrap; }
  .seg-btn{
    flex: 1; min-width: 108px; display:flex; align-items:center; gap: 9px;
    padding: 10px 13px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; cursor: pointer; text-align:left; transition: all .15s ease;
  }
  .seg-btn:hover{ border-color: var(--ink-soft); }
  .seg-dot{ width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--line); }
  .seg-verde .seg-dot{ background: var(--moss); }
  .seg-amarelo .seg-dot{ background: var(--ochre); }
  .seg-vermelho .seg-dot{ background: var(--brick); }
  .seg-text{ display:flex; flex-direction:column; line-height:1.3; }
  .seg-label{ font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .seg-sub{ font-size: 10.5px; color: var(--ink-soft); opacity:.75; }
  .seg-btn.selected{ box-shadow: 0 1px 3px rgba(43,42,36,0.08); }
  .seg-btn.selected .seg-label{ color: var(--ink); }
  .seg-btn.selected.seg-verde{ background: var(--moss-soft); border-color: var(--moss); }
  .seg-btn.selected.seg-amarelo{ background: var(--ochre-soft); border-color: var(--ochre); }
  .seg-btn.selected.seg-vermelho{ background: var(--brick-soft); border-color: var(--brick); }

  .status-note{
    margin: 14px 0 0; padding: 10px 14px; border-radius: 10px;
    font-size: 13.5px; line-height: 1.5;
  }
  .status-note.verde{ background: var(--moss-soft); color: #3B4A32; }
  .status-note.amarelo{ background: var(--ochre-soft); color: #6E4D1B; }
  .status-note.vermelho{ background: var(--brick-soft); color: #6B2F24; }

  .mood-row{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .mood-btn{
    width: 46px; height: 46px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; padding: 0;
    transition: all .15s ease;
  }
  .mood-icon{ font-size: 21px; line-height:1; filter: grayscale(1) opacity(0.55); }
  .mood-btn.selected{ background: var(--mood-color); border-color: var(--mood-color); box-shadow: 0 0 0 3px rgba(47,110,99,0.12); }
  .mood-btn.selected .mood-icon{ filter: none; }

  .cycle-banner{ background: var(--paper-2); border-radius: 12px; padding: 14px 16px; margin: 0 0 20px; }

  .group-label{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-soft); margin: 22px 0 10px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  ul.ex-list{ list-style:none; margin:0; padding:0; }
  ul.ex-list li{
    display:flex; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px;
  }
  ul.ex-list li:last-child{ border-bottom: none; }
  .ex-name{ font-weight: 500; }
  .ex-sets{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); white-space:nowrap; }

  .cardio-tag{
    display:inline-block; margin-top:16px; padding: 8px 12px; border-radius: 8px;
    background: var(--paper-2); font-size: 13px; color: var(--ink-soft);
  }
  .rest-block{ text-align:center; padding: 26px 10px; }
  .rest-block .big{ font-family:'Fraunces', serif; font-size: 22px; margin-bottom: 6px; }

  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 8px; }

  /* ---- Painel ---- */
  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(128px,1fr)); gap: 12px; margin: 18px 0 20px; }
  .stat{ background: var(--paper-2); border-radius: 12px; padding: 13px 15px; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size: 23px; font-weight: 600; }
  .stat .lbl{ font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  .gentle{ background: var(--moss-soft); border-radius: 12px; padding: 14px 16px; font-size: 13.5px; color: #3B4A32; margin-bottom: 18px; }

  .config-row{ display:flex; gap: 20px; flex-wrap:wrap; background: var(--paper-2); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
  .config-field{ display:flex; align-items:center; gap: 8px; }
  .config-field label{ font-size: 12.5px; color: var(--ink-soft); }
  .config-field input{ width: 76px; font-family:'IBM Plex Mono', monospace; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 13px; background: #fff; }

  .form-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 6px; }
  .field label{ display:block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .field input:not([type="checkbox"]), .field select{
    width:100%; font-family:'IBM Plex Mono', monospace; border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; background: var(--paper);
  }
  .field.full{ grid-column: 1 / -1; }

  /* water */
  .water-row{ display:flex; align-items:center; gap: 14px; flex-wrap: wrap; margin: 10px 0 4px; }
  .bottles{ display:flex; gap: 8px; }
  .bottle-btn{ background:none; border:none; cursor:pointer; padding:0; color: var(--line); }
  .bottle-btn.filled{ color: var(--teal); }
  .bottle-btn svg{ width: 22px; height: 36px; display:block; }
  .water-total{ font-family:'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--ink-soft); }

  /* meals */
  .meal-card{ border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .meal-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 10px; }
  .meal-title{ font-weight: 600; font-size: 14.5px; }
  .meal-kcal{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--teal); font-weight: 600; }
  .chips{ display:flex; flex-wrap:wrap; gap: 7px; margin-bottom: 10px; }
  .chip{
    font-family:'IBM Plex Mono', monospace; font-size: 11.5px; padding: 6px 10px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--paper); cursor:pointer; color: var(--ink-soft); white-space:nowrap;
  }
  .chip:hover{ border-color: var(--teal); color: var(--teal); }
  .item-list{ margin-bottom: 8px; }
  .item-row{ display:flex; align-items:center; gap: 8px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .item-row:last-child{ border-bottom:none; }
  .item-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-kcal{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); white-space:nowrap; }
  .item-x{ background:none; border:none; color: var(--brick); cursor:pointer; font-size: 15px; line-height:1; padding: 0 2px; }

  .item-check-label{ display:flex; align-items:center; gap:8px; flex:1 1 160px; min-width:0; cursor:pointer; }
  .item-name-wrap{ flex:1; min-width:0; overflow:hidden; }
  .plan-sel{
    width:100%; max-width:100%; box-sizing:border-box;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    border:1px solid var(--line); border-radius:6px; padding:5px 6px; background:var(--paper);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .treino-alt-select{
    display:block; width:100%; max-width:100%; box-sizing:border-box;
    font-family:'Inter', sans-serif; font-size:13.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--paper);
    margin:14px 0 2px; overflow:hidden; text-overflow:ellipsis;
  }
  .item-meta{ display:flex; align-items:center; gap:8px; flex-shrink:0; margin-left:auto; }
  .qty-box{ display:flex; align-items:center; gap:4px; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .plan-qty{ width:52px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:6px; padding:5px 6px; background:var(--paper); box-sizing:border-box; }
  .qty-unit{ font-size:12px; color:var(--ink-soft); }
  /* ── Resumo de macros do dia ── */
  .macro-summary{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:10px 0 20px; }
  .macro-item{ background:var(--paper-2); border-radius:12px; padding:13px 15px; }
  .macro-num{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; line-height:1.1; }
  .macro-goal{ font-size:13px; font-weight:400; color:var(--ink-soft); }
  .macro-lbl{ font-size:10.5px; color:var(--ink-soft); margin:3px 0 8px; line-height:1.3; }
  .macro-summary .kcal-progress-bar{ height:6px; border-radius:4px; background:rgba(43,42,36,0.10); overflow:hidden; }

  /* ── Item de alimento registrado ── */
  .food-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .food-row:last-child{ border-bottom:none; }
  .food-main{ flex:1; min-width:0; cursor:pointer; }
  .food-name{ display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .food-qty{ display:block; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .food-qty .conv{ opacity:.65; }
  .food-macros{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; }
  .food-kcal{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--teal); }
  .food-prot{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ochre); }
  .macro-unit{ font-size:9.5px; opacity:.7; margin-left:2px; }

  /* ── Botão e busca de alimento ── */
  .add-food-btn{
    width:100%; margin-top:6px; padding:11px; border-radius:10px;
    border:1px dashed var(--line); background:transparent; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-size:13.5px; cursor:pointer;
  }
  .add-food-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .food-search{ margin-top:8px; }
  .food-search-input{
    width:100%; box-sizing:border-box; padding:10px 12px; border-radius:9px;
    border:1.5px solid var(--teal); background:#fff; font-family:'Inter',sans-serif;
  }
  .food-results{ max-height:230px; overflow-y:auto; margin-top:6px; }
  .food-result{
    display:block; width:100%; text-align:left; padding:9px 10px; margin-bottom:4px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); cursor:pointer;
  }
  .food-result:hover{ border-color:var(--teal); }
  .fr-name{ display:block; font-size:13.5px; font-weight:600; color:var(--ink); }
  .fr-info{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .fr-per{ opacity:.6; }
  .search-cancel{
    width:100%; margin-top:4px; padding:8px; border:none; background:transparent;
    color:var(--ink-soft); font-family:'Inter',sans-serif; font-size:12.5px; cursor:pointer; text-decoration:underline;
  }

  /* ── Editor de quantidade ── */
  .qty-overlay{
    position:fixed; inset:0; background:rgba(43,42,36,0.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .qty-panel{ background:#fff; border-radius:16px; padding:22px; width:100%; max-width:360px; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .qty-title{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 3px; }
  .qty-sub{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin:0 0 16px; }
  .qty-row{ display:flex; gap:8px; }
  .qty-row input{ flex:1; min-width:0; padding:11px; border:1px solid var(--line); border-radius:9px; background:var(--paper); font-family:'IBM Plex Mono',monospace; }
  .qty-row select{ flex:1.2; min-width:0; padding:11px 8px; border:1px solid var(--line); border-radius:9px; background:var(--paper); }
  .qty-hint{ font-size:12.5px; color:var(--ink-soft); margin:12px 0 0; line-height:1.5; }
  .qty-actions{ display:flex; gap:8px; margin-top:18px; }
  .qty-actions button{ flex:1; padding:11px; border-radius:9px; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; }
  .qty-cancel{ border:1px solid var(--line); background:transparent; color:var(--ink-soft); }
  .qty-save{ border:none; background:var(--teal); color:#fff; }

  @media (max-width:400px){ .macro-summary{ grid-template-columns:1fr; } }

  .custom-add{ display:flex; gap: 6px; margin-top: 8px; flex-wrap:wrap; }
  .custom-add input{ font-family:'IBM Plex Mono', monospace; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 12.5px; background: var(--paper); }
  .custom-add input.iname{ flex: 1; min-width: 120px; }
  .custom-add input.ikcal{ width: 74px; }
  .custom-add button{ font-family: 'Inter'; font-size: 12.5px; font-weight:600; background: var(--teal); color:#fff; border:none; border-radius: 7px; padding: 6px 12px; cursor:pointer; }

  .custom-add-v2{ display:flex; flex-direction:column; gap: 8px; }
  .custom-add-v2 input.iname-full{
    width:100%; box-sizing:border-box; font-family:'IBM Plex Mono', monospace; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--paper);
  }
  .custom-add-row{ display:flex; gap: 8px; }
  .custom-add-row input.ikcal{
    flex: 1; min-width: 0; font-family:'IBM Plex Mono', monospace; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 8px; background: var(--paper); box-sizing:border-box;
  }
  .custom-add-row button{
    font-family: 'Inter'; font-size: 12.5px; font-weight:600; background: var(--teal); color:#fff;
    border:none; border-radius: 7px; padding: 8px 16px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .obs-field{ margin-top: 10px; }
  .obs-field input{ width:100%; font-family:'Inter'; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px; background: var(--paper); }

  .kcal-progress-wrap{ margin: 6px 0 22px; }
  .kcal-progress-bar{ height: 8px; border-radius: 6px; background: var(--paper-2); overflow:hidden; margin-top: 6px; }
  .kcal-progress-fill{ height: 100%; background: var(--teal); border-radius: 6px; transition: width .2s ease; }
  .kcal-progress-num{ font-family:'IBM Plex Mono', monospace; font-size: 13.5px; }

  .entries{ margin-top: 6px; }
  .entry-row{ display:flex; gap: 10px; align-items:center; font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--ink-soft); flex-wrap: wrap; }
  .entry-row .d{ font-family:'IBM Plex Mono', monospace; width: 60px; flex-shrink:0; color: var(--ink); }
  .entry-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  details > summary{
    cursor:pointer; font-size: 12.5px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace;
    letter-spacing: 0.02em; list-style: none; user-select: none;
  }
  details > summary::-webkit-details-marker{ display:none; }
  details > summary::before{ content: '▸ '; }
  details[open] > summary::before{ content: '▾ '; }

  .danger-zone{ margin-top: 26px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .reset-link{ font-size: 12px; color: var(--brick); text-decoration: underline; cursor:pointer; background:none; border:none; font-family: inherit; padding:0; }
  .loading{ text-align:center; padding: 40px 0; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size: 13px; }

  .toast{
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); font-family:'IBM Plex Mono', monospace; font-size: 12.5px;

  function getLongestComfortableRun(){
    let longest = 0;
    Object.keys(checkins).forEach(iso => {
      const c = checkins[iso];
      if (c && c.corrida && c.corrida.conversa && c.corrida.km) {
        longest = Math.max(longest, parseFloat(c.corrida.km));
      }
    });
    if (longest > 0) return longest;
    return parseFloat(config.corridaBaseKm) || 1;
  }

  function getAllRuns(){
    const runs = [];
    Object.keys(checkins).forEach(iso => {
      const c = checkins[iso];
      if (c && c.corrida && c.corrida.km) {
        runs.push({ iso, km: parseFloat(c.corrida.km), min: c.corrida.min ? parseFloat(c.corrida.min) : null, conversa: !!c.corrida.conversa });
      }
    });
    return runs.sort((a,b) => a.iso.localeCompare(b.iso));
  }

  function runHistoryStats(){
    const runs = getAllRuns();
    const totalKm = runs.reduce((s,r)=>s+r.km, 0);
    const porMarco = RUN_GOALS.map(goal => ({
      goal,
      count: runs.filter(r => r.km >= goal && r.conversa).length
    }));
    return { runs, totalRuns: runs.length, totalKm, porMarco };
  }

  function runProjection(){
    const longest = getLongestComfortableRun();
    return RUN_GOALS.map(goal => {
      if (longest >= goal) return { goal, reached:true, sessions:0, weeks:0 };
      const sessions = Math.ceil(Math.log(goal/longest) / Math.log(RUN_WEEKLY_GROWTH));
      return { goal, reached:false, sessions, weeks: sessions }; // 1 corrida/semana
    });
  }

  function getCyclePhase(){
    if (!config.cycleLastStart) return null;
    const start = new Date(config.cycleLastStart+'T00:00:00');
    const now = new Date(todayISO+'T00:00:00');
    const diffDays = Math.floor((now-start)/(1000*60*60*24));
    const length = parseFloat(config.cycleLength) || 28;
    let dayInCycle = (diffDays % length) + 1;
    if (dayInCycle <= 0) dayInCycle += length;
    const ratio = length/28;
    const menstrualEnd = 5*ratio, follicularEnd = 13*ratio, ovulationEnd = 16*ratio;
    let phase;
    if (dayInCycle <= menstrualEnd) phase = { label:'Menstrual', note:'Energia física costuma estar mais baixa — é normal precisar de mais descanso e reduzir a intensidade se fizer sentido.', color:'var(--brick)' };

    return { dayInCycle: Math.round(dayInCycle), length, phase };

    {n:'Shake pós-treino (whey+açaí+banana+morango+leite)', k100:70, p:6, unit:'shake', unitG:490}
  ];

  // Refeições do dia (só a estrutura — os itens começam vazios e você adiciona o que comeu)
  const MEALS = [
    { key:'pre',    label:'Pré-treino' },
    { key:'cafe',   label:'Café da manhã' },
    { key:'pos',    label:'Pós-treino' },
    { key:'almoco', label:'Almoço' },
    { key:'lanche', label:'Lanche da tarde' },
    { key:'jantar', label:'Jantar' }
  ];

  // Remove acentos para a busca funcionar com "pao", "acai", "protein" etc.
  function normalize(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  const FOOD_BY_NAME = {};
  FOOD_DB.forEach(f => { FOOD_BY_NAME[f.n] = f; });

  // Converte a quantidade registrada em gramas, seja ela em 'g' ou em unidades caseiras
  function toGrams(entry){
    const f = FOOD_BY_NAME[entry.n];
    if (!f) return 0;
    return entry.mode === 'un' ? entry.qty * f.unitG : entry.qty;
  }
  function entryKcal(entry){
    const f = FOOD_BY_NAME[entry.n];
    if (!f) return 0;
    return Math.round(f.k100 * toGrams(entry) / 100);
  }
  function entryProt(entry){
    const f = FOOD_BY_NAME[entry.n];
    if (!f) return 0;
    return f.p * toGrams(entry) / 100;
  }

  function localISO(date){
    const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,'0'), d = String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  let TODAY_KEY, todayISO;
  function refreshToday(){
    const now = new Date();
    todayISO = localISO(now);
    TODAY_KEY = ['dom','seg','ter','qua','qui','sex','sab'][now.getDay()];
  }
  refreshToday();

  const DAY_KEY_ORDER = ['seg','ter','qua','qui','sex','sab','dom']; // segunda-first, alinhado ao DIAS

  function getDateForDayKey(dayKey){
    const idx = DAY_KEY_ORDER.indexOf(dayKey); // 0=segunda ... 6=domingo
    const now = new Date();
    const nowDow = now.getDay(); // 0=domingo
    const mondayOffset = (nowDow===0) ? -6 : 1-nowDow;
    const monday = new Date(now); monday.setDate(now.getDate()+mondayOffset);
    const target = new Date(monday); target.setDate(monday.getDate()+idx);
    return localISO(target);
  }

  let statusMap = {};
  let checkins = {};
  // Estado da busca de alimento (qual refeição está com a busca aberta)
  let openSearchMeal = null;
  let searchQuery = '';
  let config = { calorieGoal: '', protGoal: '', waterGoalBottles: '3', corridaBaseKm: '', cycleLastStart: '', cycleLength: '28' };
  let currentTab = 'plano';
  let panelRange = '7d'; // '7d' | 'mes'
  let currentDayKey = TODAY_KEY;
  let previewStatus = {};

  const contentEl = document.getElementById('content');
  const trailEl = document.getElementById('trail');
  const toastEl = document.getElementById('toast');

  function toast(msg){
    toastEl.textContent = msg || 'salvo ✓';
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> toastEl.classList.remove('show'), 1400);
  }

  function emptyDay(){
    return {
      peso: null, sono: null, energia: null, ciclo: null, dores: null,
      treinoFeito: false,
      water: { count: 0 },
      suplemento: false,
      meals: { pre:[], cafe:[], pos:[], almoco:[], lanche:[], jantar:[] },
      exercicios: {},
      humor: { mood: null, pensamento: '', reformulacao: '' },
      corrida: { km: null, min: null, conversa: null },
      notaDia: '',
      treinoAlternativo: '',
      treinoCustom: []
    };
  }

  function getDay(iso){
    if (!checkins[iso]) checkins[iso] = emptyDay();
    const d = checkins[iso];
    if (!d.water) d.water = { count:0 };
    if (!d.meals) d.meals = { pre:[], cafe:[], pos:[], almoco:[], lanche:[], jantar:[] };
    MEALS.forEach(m => { if (!d.meals[m.key]) d.meals[m.key] = []; });
    if (typeof d.suplemento === 'undefined') d.suplemento = false;
    if (!d.exercicios) d.exercicios = {};
    if (!d.humor) d.humor = { mood: null, pensamento: '', reformulacao: '' };
    if (!d.corrida) d.corrida = { km: null, min: null, conversa: null };
    if (typeof d.notaDia === 'undefined') d.notaDia = '';
    if (typeof d.treinoAlternativo === 'undefined') d.treinoAlternativo = '';
    if (!d.treinoCustom) d.treinoCustom = [];
    return d;
  }

  function mealKcal(d, mealKey){
    return (d.meals[mealKey]||[]).reduce((s,e)=> s + entryKcal(e), 0);
  }
  function mealProt(d, mealKey){
    return (d.meals[mealKey]||[]).reduce((s,e)=> s + entryProt(e), 0);
  }
  function dayTotalKcal(d){
    if (!d.meals) return 0;
    return MEALS.reduce((s,m)=> s + mealKcal(d, m.key), 0);
  }
  function dayTotalProt(d){
    if (!d.meals) return 0;
    return MEALS.reduce((s,m)=> s + mealProt(d, m.key), 0);
  }

  function getExState(d, exId){
    const raw = d.exercicios[exId];
    if (raw && typeof raw === 'object') return { sel:0, ...raw };
    if (typeof raw === 'boolean') return { done: raw, carga: null, sel: 0 };
    return { done: false, carga: null, sel: 0 };
  }

  const MOOD_SCALE = [
    { v:1, label:'Muito difícil', icon:'😞', color:'var(--brick)' },
    { v:2, label:'Difícil', icon:'🙁', color:'#C08072' },
    { v:3, label:'Neutro', icon:'😐', color:'var(--ochre)' },
    { v:4, label:'Bem', icon:'🙂', color:'#8FAE7C' },
    { v:5, label:'Muito bem', icon:'😄', color:'var(--moss)' }
  ];

  function getLatestWeight(){
    const dates = Object.keys(checkins).sort();
    for (let i = dates.length-1; i>=0; i--){
      const c = checkins[dates[i]];
      if (c && c.peso) return parseFloat(c.peso);
    }
    return 47.5;
  }

  async function saveDay(iso){
    try { await storage.set('checkin:'+iso, JSON.stringify(checkins[iso]), false); } catch(e){}
  }
  async function saveConfig(){
    try { await storage.set('config', JSON.stringify(config), false); } catch(e){}
  }

  async function loadAll(){
    try {
      const list = await storage.list('status:', false);
      if (list && list.keys) for (const k of list.keys) {
        try { const r = await storage.get(k, false); if (r) statusMap[k.replace('status:','')] = r.value; } catch(e){}
      }
    } catch(e){}
    try {
      const list2 = await storage.list('checkin:', false);
      if (list2 && list2.keys) for (const k of list2.keys) {
        try { const r = await storage.get(k, false); if (r) checkins[k.replace('checkin:','')] = JSON.parse(r.value); } catch(e){}
      }
    } catch(e){}
    try {
      const r = await storage.get('config', false);
      if (r) config = Object.assign(config, JSON.parse(r.value));
    } catch(e){}
    render();
  }

  function isEditableDayKey(dayKey){
    return getDateForDayKey(dayKey) <= todayISO;
  }

  function statusFor(dayKey){
    const dateForDay = getDateForDayKey(dayKey);
    if (isEditableDayKey(dayKey)) return statusMap[dateForDay] || null;
    return previewStatus[dayKey] || null;
  }

  async function setStatus(dayKey, v){
    if (isEditableDayKey(dayKey)) {
      const dateForDay = getDateForDayKey(dayKey);
      const current = statusMap[dateForDay] || null;
      const next = (current === v) ? null : v; // clicar de novo na mesma opção desmarca
      if (next) {
        statusMap[dateForDay] = next;
        try { await storage.set('status:'+dateForDay, next, false); } catch(e){}
      } else {
        delete statusMap[dateForDay];
        try { await storage.delete('status:'+dateForDay, false); } catch(e){}
      }
      const d = getDay(dateForDay);
      d.treinoFeito = (next === 'verde' || next === 'amarelo');
      await saveDay(dateForDay);
      toast();
    } else {
      previewStatus[dayKey] = (previewStatus[dayKey] === v) ? null : v;
    }
    render();
  }

  function renderTrail(){
    trailEl.innerHTML = '<div class="trail-path"></div><div class="trail-row"></div>';
    const row = trailEl.querySelector('.trail-row');
    DIAS.forEach(d => {
      const st = statusFor(d.key);
      const btn = document.createElement('button');
      btn.className = 'waypoint' + (currentDayKey===d.key ? ' active' : '');
      btn.innerHTML = `<span class="dot${st ? ' status-'+st : ''}">${d.type==='descanso' ? '·' : (d.type==='corrida' ? '↝' : '')}</span>
        <span class="label">${d.label}</span>
        ${d.key===TODAY_KEY ? '<span class="today-mark">hoje</span>' : ''}`;
      btn.onclick = () => { currentDayKey = d.key; openSearchMeal = null; searchQuery = ''; render(); };
      row.appendChild(btn);
    });
  }

  function renderDay(d){
    const st = statusFor(d.key);
    const isToday = d.key === TODAY_KEY;
    const dateForDay = getDateForDayKey(d.key);
    const editable = isEditableDayKey(d.key);
    const dayData = editable ? getDay(dateForDay) : null;
    let html = `<div class="card-head">
      <div>
        <p class="card-eyebrow">${d.label}${isToday ? ' · hoje' : ''} <span style="opacity:0.5;">(app calcula: ${dateForDay})</span></p>
        <h2 class="card-title">${d.title}</h2>
        <p class="card-focus">${d.focus}</p>
      </div>
    </div>`;

    if (d.type === 'treino') {
      const SEGS = [
        { v:'verde', label:'Completo', sub:'essenciais + complementares' },
        { v:'amarelo', label:'Reduzido', sub:'só essenciais' },
        { v:'vermelho', label:'Descanso', sub:'sem treino hoje' }
      ];
      html += `<div class="segctl" role="group" aria-label="Como está sua energia para o treino">
        ${SEGS.map(s => `<button class="seg-btn seg-${s.v} ${st===s.v?'selected':''}" data-v="${s.v}">
          <span class="seg-dot"></span>
          <span class="seg-text"><span class="seg-label">${s.label}</span><span class="seg-sub">${s.sub}</span></span>
        </button>`).join('')}
      </div>`;
    }

    function exList(list, prefix){
      return `<ul class="ex-list">${list.map((ex,i)=>{
        const exId = prefix+i;
        const state = editable ? getExState(dayData, exId) : { done:false, carga:null, sel:0 };
        const hasSubs = ex.subs && ex.subs.length;
        const active = (hasSubs && state.sel > 0) ? ex.subs[state.sel-1] : ex;
        const nameHtml = hasSubs
          ? `<select class="ex-sel" data-id="${exId}" style="font-family:'IBM Plex Mono',monospace; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:3px 5px; background:var(--paper); ${state.done?'text-decoration:line-through; color:var(--ink-soft);':''}">
               <option value="0" ${state.sel===0?'selected':''}>${ex.n}</option>
               ${ex.subs.map((s,si)=>`<option value="${si+1}" ${state.sel===si+1?'selected':''}>${s.n}</option>`).join('')}
             </select>`
          : `<span style="${state.done?'text-decoration:line-through; color:var(--ink-soft);':''}">${ex.n}</span>`;
        return `<li style="flex-wrap:wrap;">
          <span class="ex-name" style="display:flex; align-items:center; gap:8px; flex:1; min-width:0;">
            ${editable ? `<input type="checkbox" class="ex-chk" data-id="${exId}" ${state.done?'checked':''}>` : ''}
            ${nameHtml}
          </span>
          <span style="display:flex; align-items:center; gap:8px;">
            ${editable && state.done ? `<input type="number" class="ex-carga" data-id="${exId}" value="${state.carga||''}" placeholder="kg" style="width:56px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:6px; padding:5px 6px; background:var(--paper);">` : ''}
            <span class="ex-sets">${active.s}</span>
          </span>
        </li>`;
      }).join('')}</ul>`;
    }

    if (d.type === 'descanso') {
      html += `<div class="rest-block"><p class="big">🌿 dia de descanso</p><p class="sub">${d.texto}</p></div>`;
    } else if (d.type === 'corrida') {
      const proj = runProjection();
      const next = proj.find(p => !p.reached);
      const longest = getLongestComfortableRun();
      html += `<div style="text-align:left;"><p style="font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin:14px 0 0;">${d.texto}</p></div>`;
      html += `<div class="meal-card" style="margin-top:16px;">
        <div class="meal-head"><span class="meal-title">Rumo aos 5 / 10 / 12km</span><span class="meal-kcal">maior contínua: ${longest}km</span></div>
        ${next ? `<p class="hint" style="margin:6px 0 0;">Próxima meta: <strong style="color:var(--ink);">${next.goal}km</strong> em ~${next.sessions} corrida${next.sessions===1?'':'s'} (~${next.weeks} semana${next.weeks===1?'':'s'}), mantendo o ritmo de conversa e evoluindo aos poucos (regra dos 10%/semana).</p>` : `<p class="hint" style="margin:6px 0 0;">Você já bateu todas as metas cadastradas (até ${RUN_GOALS[RUN_GOALS.length-1]}km) 🎉</p>`}
      </div>`;
      if (editable) {
        html += `<div class="form-grid" style="margin-top:14px;">
          <div class="field"><label>Distância (km)</label><input type="number" step="0.1" id="fCorridaKm" value="${dayData.corrida.km||''}" placeholder="ex: 3.5"></div>
          <div class="field"><label>Tempo (min)</label><input type="number" id="fCorridaMin" value="${dayData.corrida.min||''}" placeholder="ex: 28"></div>
          <div class="field full"><label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:400;"><input type="checkbox" id="fCorridaConversa" ${dayData.corrida.conversa?'checked':''}> Consegui manter o ritmo de conversa</label></div>
        </div>`;
      }
    } else {
      if (st) html += `<div class="status-note ${st}">${STATUS_NOTE[st]}</div>`;

      const overrideKey = editable ? (dayData.treinoAlternativo || '') : '';
      const isCustom = overrideKey === 'custom';
      const activeTpl = (overrideKey && overrideKey !== d.key && !isCustom) ? TREINO_TEMPLATES.find(t => t.key === overrideKey) : d;

      if (editable) {
        html += `<select id="fTreinoAlt" class="treino-alt-select">
          <option value="">Fiz o treino previsto (${d.title})</option>
          ${TREINO_TEMPLATES.filter(t=>t.key!==d.key).map(t=>`<option value="${t.key}" ${overrideKey===t.key?'selected':''}>Adaptei — fiz ${t.title} (${t.label})</option>`).join('')}
          <option value="custom" ${isCustom?'selected':''}>Outro treino (não previsto — personalizado)</option>
        </select>`;
      }
      if (overrideKey && overrideKey !== d.key && !isCustom) {
        html += `<p class="hint" style="margin:4px 0 12px;">Adaptado — o previsto pra hoje era ${d.title}, mas o que conta é o que você conseguiu fazer.</p>`;
      }

      if (isCustom) {
        const items = dayData.treinoCustom || [];
        const doneCount = items.filter(it=>it.done).length;
        html += `<p class="hint" style="margin:4px 0 12px;">Monte a lista com o que você realmente treinou hoje — fora do seu planejamento fixo.</p>`;
        html += `<p class="group-label"><span>Exercícios de hoje</span><span>${doneCount}/${items.length}</span></p>`;
        html += `<ul class="ex-list">${items.map((it,i)=>`
          <li style="flex-wrap:wrap;">
            <span class="ex-name" style="display:flex; align-items:center; gap:8px; flex:1; min-width:0;">
              <input type="checkbox" class="custom-ex-chk" data-i="${i}" ${it.done?'checked':''}>
              <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; ${it.done?'text-decoration:line-through; color:var(--ink-soft);':''}">${it.n}${it.s?' · '+it.s:''}</span>
            </span>
            <span style="display:flex; align-items:center; gap:8px;">
              ${it.done ? `<input type="number" class="custom-ex-carga" data-i="${i}" value="${it.carga||''}" placeholder="kg" style="width:56px;">` : ''}
              <button class="item-x custom-ex-x" data-i="${i}" title="remover">×</button>
            </span>
          </li>`).join('') || '<p class="hint" style="margin:0;">Nenhum exercício adicionado ainda.</p>'}
        </ul>`;
        html += `<div class="custom-add" style="margin-top:10px;">
          <input type="text" class="iname" id="fCustomExNome" placeholder="nome do exercício">
          <input type="text" class="ikcal" id="fCustomExSets" placeholder="ex: 3x12" style="width:80px;">
          <button id="btnAddCustomEx">adicionar</button>
        </div>`;
      } else {
        const essDone = editable ? activeTpl.essenciais.filter((ex,i)=> getExState(dayData,'e'+i).done).length : 0;
        html += `<p class="group-label"><span>Essenciais</span>${editable ? `<span>${essDone}/${activeTpl.essenciais.length}</span>` : ''}</p>`;
        html += exList(activeTpl.essenciais, 'e');
        if (st !== 'amarelo' && st !== 'vermelho') {
          const compDone = editable ? activeTpl.complementares.filter((ex,i)=> getExState(dayData,'c'+i).done).length : 0;
          html += `<p class="group-label"><span>Complementares</span>${editable ? `<span>${compDone}/${activeTpl.complementares.length}</span>` : ''}</p>`;
          html += exList(activeTpl.complementares, 'c');

          const abPair = (AB_ROTATION[d.key] || [0,1]).map(i => CIRCUITO_ABDOMINAL[i]);
          const abDone = editable ? abPair.filter((ex,i)=> getExState(dayData,'ab'+i).done).length : 0;
          html += `<p class="group-label"><span>Circuito abdominal</span>${editable ? `<span>${abDone}/${abPair.length}</span>` : ''}</p>`;
          html += exList(abPair, 'ab');
        }
        if (activeTpl.cardio) html += `<div class="cardio-tag">🏃 ${activeTpl.cardio}</div>`;
      }
    }

    if (editable && d.type !== 'corrida') {
      html += `<details ${(dayData.corrida.km)?'open':''} style="margin:18px 0 0;">
        <summary>🏃 Correu hoje, fora do previsto? Registrar aqui</summary>
        <div class="form-grid" style="margin-top:10px;">
          <div class="field"><label>Distância (km)</label><input type="number" step="0.1" id="fCorridaKm" value="${dayData.corrida.km||''}" placeholder="ex: 5"></div>
          <div class="field"><label>Tempo (min)</label><input type="number" id="fCorridaMin" value="${dayData.corrida.min||''}" placeholder="ex: 30"></div>
          <div class="field full"><label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:400;"><input type="checkbox" id="fCorridaConversa" ${dayData.corrida.conversa?'checked':''}> Consegui manter o ritmo de conversa</label></div>
        </div>
        <p class="hint" style="margin-top:8px;">Conta pra sua progressão de corrida (aba Progressão) do mesmo jeito, não importa em que dia aconteceu.</p>
      </details>`;
    }

    if (editable) {
      html += `<div class="field full" style="margin-top:18px;">
        <label>📝 Nota do dia (adaptações, o que rolou diferente do plano)</label>
        <input type="text" id="fNotaDia" value="${dayData.notaDia||''}" placeholder="ex: sem acesso à academia, treinei na do prédio">
      </div>`;
    }

    if (editable) {
      html += `<p class="group-label" style="margin-top:22px;"><span>Como você está se sentindo${isToday?' hoje':' nesse dia'}?</span></p>
      <div class="mood-row">${MOOD_SCALE.map(m=>`<button class="mood-btn ${dayData.humor.mood===m.v?'selected':''}" data-v="${m.v}" style="--mood-color:${m.color}" title="${m.label}"><span class="mood-icon">${m.icon}</span></button>`).join('')}</div>
      <details ${(dayData.humor.pensamento||dayData.humor.reformulacao)?'open':''} style="margin:12px 0 0;">
        <summary>Registrar um pensamento (opcional)</summary>
        <div class="form-grid" style="margin-top:10px;">
          <div class="field full"><label>O que passou pela cabeça</label><input type="text" id="fPensamento" value="${dayData.humor.pensamento||''}" placeholder="ex: sinto que não estou evoluindo rápido o suficiente"></div>
          <div class="field full"><label>Outro jeito de olhar pra isso (opcional)</label><input type="text" id="fReformulacao" value="${dayData.humor.reformulacao||''}" placeholder="ex: 2,5kg em 3 meses é um ritmo saudável, não precisa ser rápido"></div>
        </div>
        <p class="hint" style="margin-top:8px;">Baseado em reestruturação cognitiva (TCC): nomear o pensamento e buscar um ângulo alternativo ajuda a reduzir o peso emocional dele. É um registro pessoal, não substitui acompanhamento profissional.</p>
      </details>`;
    } else {
      html += `<p class="hint">Esse dia ainda não chegou — os registros ficam disponíveis a partir do dia em questão.</p>`;
    }

    contentEl.innerHTML = html;

    if (editable) {
      const fPens = document.getElementById('fPensamento');
      const fReform = document.getElementById('fReformulacao');
      if (fPens) fPens.onchange = async (e) => { dayData.humor.pensamento = e.target.value; await saveDay(dateForDay); toast(); };
      if (fReform) fReform.onchange = async (e) => { dayData.humor.reformulacao = e.target.value; await saveDay(dateForDay); toast(); };
    }

    if (d.type === 'treino') {
      contentEl.querySelectorAll('.seg-btn').forEach(b => {
        b.onclick = () => setStatus(d.key, b.dataset.v);
      });
      if (editable) {
        contentEl.querySelectorAll('.ex-chk').forEach(chk => {
          chk.onchange = async (e) => {
            const state = getExState(dayData, chk.dataset.id);
            state.done = e.target.checked;
            dayData.exercicios[chk.dataset.id] = state;
            await saveDay(dateForDay);
            toast();
            render();
          };
        });
        contentEl.querySelectorAll('.ex-carga').forEach(inp => {
          inp.onchange = async (e) => {
            const state = getExState(dayData, inp.dataset.id);
            state.carga = parseFloat(e.target.value) || null;
            dayData.exercicios[inp.dataset.id] = state;
            await saveDay(dateForDay);
            toast();
          };
        });
        contentEl.querySelectorAll('.ex-sel').forEach(sel => {
          sel.onchange = async (e) => {
            const state = getExState(dayData, sel.dataset.id);
            state.sel = parseInt(e.target.value);
            dayData.exercicios[sel.dataset.id] = state;
            await saveDay(dateForDay);
            toast();
            render();
          };
        });
        const fTreinoAlt = document.getElementById('fTreinoAlt');

  function weekDates(){
    const arr = [];
    const now = new Date();
    for (let i=6;i>=0;i--){
      const dt = new Date(now); dt.setDate(now.getDate()-i);
      arr.push(localISO(dt));
    }
    return arr;
  }

  function monthDates(){
    const arr = [];
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    for (let dt = new Date(first); dt <= now; dt.setDate(dt.getDate()+1)){
      arr.push(localISO(new Date(dt)));
    }
    return arr;
  }

  function computeStats(dates){
    let pesos = [], sonos = [], energias = [], kcals = [], waters = [], moods = [];
    let sonoSeries = [], kcalSeries = [], moodSeries = [], statusSeries = [];
    let verde=0, amarelo=0, vermelho=0, treinoDias=0, registrados=0;
    dates.forEach(iso => {
      const wd = new Date(iso+'T00:00:00').getDay();
      if (wd>=1 && wd<=5) treinoDias++; // seg-sex = dias de treino previstos
      const st = statusMap[iso];
      statusSeries.push({iso, st: st||null});
      if (st==='verde') verde++;
      else if (st==='amarelo') amarelo++;
      else if (st==='vermelho') vermelho++;
      if (checkins[iso]) {
        registrados++;
        const c = getDay(iso);
        if (c.peso) pesos.push({iso, v:parseFloat(c.peso)});
        if (c.sono) { sonos.push(parseFloat(c.sono)); sonoSeries.push({iso, v:parseFloat(c.sono)}); }
        if (c.energia) energias.push(parseInt(c.energia));
        const kc = dayTotalKcal(c);
        if (kc>0) { kcals.push(kc); kcalSeries.push({iso, v:kc}); }
        if (c.water && c.water.count>0) waters.push(c.water.count);
        if (c.humor && c.humor.mood) { moods.push(c.humor.mood); moodSeries.push({iso, v:c.humor.mood}); }
      }
    });
    const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;
    return {
      pesoAvg: avg(pesos.map(p=>p.v)), pesoSeries: pesos,
      sonoAvg: avg(sonos), sonoSeries,
      energiaAvg: avg(energias),
      kcalAvg: avg(kcals), kcalSeries,
      waterAvg: avg(waters),
      moodAvg: avg(moods), moodSeries,
      statusSeries,
      verde, amarelo, vermelho, treinoDias, registrados, totalDias: dates.length
    };
  }

  function sparklineSvg(series){
    if (series.length < 2) return '<p class="hint" style="margin:6px 0 0;">Registre o peso em pelo menos 2 dias do mês para ver a tendência aqui.</p>';
    const w = 320, h = 64, pad = 6;
    const vals = series.map(p=>p.v);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const stepX = (w - pad*2) / (series.length-1);
    const pts = series.map((p,i)=>{
      const x = pad + i*stepX;
      const y = h - pad - ((p.v-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const last = pts[pts.length-1];
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">
      <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--teal)"/>
    </svg>`;
  }

  function calendarGridSvg(dates){
    const first = new Date(dates[0]+'T00:00:00');
    const dow = first.getDay();
    const mondayIndex = (dow===0) ? 6 : dow-1;
    const cell=28, gap=4, cols=7;
    const totalCells = mondayIndex + dates.length;
    const rows = Math.ceil(totalCells/cols);
    const w = cols*(cell+gap)-gap, h = rows*(cell+gap)-gap;
    let rects = '';
    dates.forEach((iso,i)=>{
      const pos = mondayIndex+i;
      const col = pos%cols, row = Math.floor(pos/cols);
      const x = col*(cell+gap), y = row*(cell+gap);
      const st = statusMap[iso];
      const fill = st==='verde'?'var(--moss)':st==='amarelo'?'var(--ochre)':st==='vermelho'?'var(--brick)':'var(--paper-2)';
      const isToday = iso===todayISO;
      const dayNum = parseInt(iso.slice(8,10));
      rects += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="5" fill="${fill}" ${isToday?'stroke="var(--teal)" stroke-width="2"':''}/><text x="${x+cell/2}" y="${y+cell/2+3}" font-size="9" text-anchor="middle" fill="${st?'#fff':'var(--ink-soft)'}" font-family="IBM Plex Mono, monospace">${dayNum}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; max-width:340px; height:auto; margin-top:8px;">${rects}</svg>`;
  }

  function weeklyTrainingBarSvg(dates){
    const weeks = {};
    dates.forEach(iso=>{
      const dt = new Date(iso+'T00:00:00');
      const dow = dt.getDay();
      const mondayIndex = (dow===0)?6:dow-1;
      const weekStart = new Date(dt); weekStart.setDate(dt.getDate()-mondayIndex);
      const key = localISO(weekStart);
      if (!weeks[key]) weeks[key] = { total:0, done:0 };
      if (dow>=1 && dow<=5) weeks[key].total++;
      const st = statusMap[iso];
      if (st==='verde' || st==='amarelo') weeks[key].done++;
    });
    const keys = Object.keys(weeks).sort();
    if (!keys.length) return '<p class="hint" style="margin:6px 0 0;">Sem dados suficientes ainda.</p>';
    const w=320, h=100, pad=26;
    const maxTotal = Math.max(...keys.map(k=>weeks[k].total), 1);
    const slot = (w-pad*2)/keys.length;
    const barW = slot*0.55;
    let bars = '';
    keys.forEach((k,i)=>{
      const wk = weeks[k];
      const x = pad + i*slot + (slot-barW)/2;
      const barH = wk.total ? (h-pad*2) * (wk.total/maxTotal) : 2;
      const pct = wk.total ? wk.done/wk.total : 0;
      const doneH = barH*pct;
      const y = h-pad-barH;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="var(--paper-2)"/>
        <rect x="${x}" y="${y+barH-doneH}" width="${barW}" height="${doneH}" rx="3" fill="var(--teal)"/>
        <text x="${x+barW/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">S${i+1}</text>
        <text x="${x+barW/2}" y="${y-5}" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${wk.done}/${wk.total}</text>`;
    });
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">${bars}</svg>`;
  }

  function kcalBarSvg(series, goal){
    if (!series.length) return '<p class="hint" style="margin:6px 0 0;">Sem registros de calorias neste período.</p>';
    const w=340, h=100, pad=20;
    const vals = series.map(p=>p.v);
    const max = Math.max(...vals, goal||0) * 1.1;
    const slot = (w-pad*2)/series.length;
    const barW = Math.max(slot*0.6, 2);
    let bars = '';
    series.forEach((p,i)=>{
      const x = pad + i*slot + (slot-barW)/2;
      const barH = (h-pad*2) * (p.v/max);
      const y = h-pad-barH;
      const over = goal && p.v>goal;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="2" fill="${over?'var(--ochre)':'var(--teal)'}"/>`;
    });
    let goalLine = '';
    if (goal){
      const gy = h-pad-(h-pad*2)*(goal/max);
      goalLine = `<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="var(--brick)" stroke-width="1" stroke-dasharray="3,3"/>`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">${bars}${goalLine}</svg>`;
  }

  function sonoLineSvg(series){
    if (series.length < 2) return '<p class="hint" style="margin:6px 0 0;">Registre o sono em pelo menos 2 dias para ver a linha aqui.</p>';
    const w=320, h=64, pad=8;
    const vals = series.map(p=>p.v);
    const min = Math.min(...vals,5), max = Math.max(...vals,9);
    const range = (max-min) || 1;
    const stepX = (w-pad*2)/(series.length-1);
    const pts = series.map((p,i)=>{
      const x = pad+i*stepX;
      const y = h-pad-((p.v-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const last = pts[pts.length-1];
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">
      <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--teal)"/>
    </svg>`;
  }

  function moodLineSvg(series){
    if (series.length < 2) return '<p class="hint" style="margin:6px 0 0;">Registre o humor em pelo menos 2 dias para ver a linha aqui.</p>';
    const w=320, h=64, pad=8;
    const stepX = (w-pad*2)/(series.length-1);
    const pts = series.map((p,i)=>{
      const x = pad+i*stepX;
      const y = h-pad-((p.v-1)/4)*(h-pad*2);
      return [x,y,p.v];
    });
    const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = pts.map(p=>{
      const m = MOOD_SCALE.find(m=>m.v===Math.round(p[2]));
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${m?m.color:'var(--teal)'}"/>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; margin-top:8px;">
      <path d="${path}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" opacity="0.5"/>${dots}
    </svg>`;
  }

      <div class="stat"><div class="num">${pesoAvg!==null ? pesoAvg.toFixed(1)+'kg' : '—'}</div><div class="lbl">⚖ peso médio (${rangeLabel}) · meta 51kg</div></div>
      <div class="stat"><div class="num">${verde+amarelo}/${treinoDias}</div><div class="lbl">💪 treinos feitos (${rangeLabel})</div></div>
      <div class="stat"><div class="num">${sonoAvg!==null ? sonoAvg.toFixed(1)+'h' : '—'}</div><div class="lbl">😴 sono médio (${rangeLabel})</div></div>
      <div class="stat"><div class="num">${energiaAvg!==null ? energiaAvg.toFixed(1) : '—'}</div><div class="lbl">⚡ energia média (1–5)</div></div>
      <div class="stat"><div class="num">${kcalAvg!==null ? Math.round(kcalAvg) : '—'}</div><div class="lbl">🍽 kcal média/dia (${rangeLabel})</div></div>
      <div class="stat"><div class="num">${waterAvg!==null ? waterAvg.toFixed(1) : '—'}</div><div class="lbl">💧 garrafinhas/dia (${rangeLabel})</div></div>
    </div>`;

    if (panelRange === 'mes') {
      const pesoSeries = stats.pesoSeries;
      const variacao = pesoSeries.length>=2 ? (pesoSeries[pesoSeries.length-1].v - pesoSeries[0].v) : null;
      html += `<div class="meal-card">
        <div class="meal-head"><span class="meal-title">Tendência de peso — ${monthName}</span>
        <span class="meal-kcal" style="color:${variacao>0?'var(--moss)':variacao<0?'var(--brick)':'var(--ink-soft)'}">${variacao!==null ? (variacao>0?'+':'')+variacao.toFixed(1)+'kg no mês' : ''}</span></div>
        ${sparklineSvg(pesoSeries)}
      </div>`;
      html += `<div class="stat-grid" style="margin-top:0;">
        <div class="stat"><div class="num">${verde}</div><div class="lbl">🟢 dias verdes</div></div>
        <div class="stat"><div class="num">${amarelo}</div><div class="lbl">🟡 dias amarelos</div></div>
        <div class="stat"><div class="num">${vermelho}</div><div class="lbl">🔴 dias vermelhos</div></div>
        <div class="stat"><div class="num">${registrados}/${totalDias}</div><div class="lbl">📝 dias com registro</div></div>
      </div>`;
    }

    html += `<details style="margin: 0 0 20px;">
      <summary>Ajustar metas (calorias e água)</summary>
      <div class="config-row" style="margin-top:10px;">
        <div class="config-field"><label>Meta calórica diária</label><input type="number" id="fGoalKcal" value="${config.calorieGoal||DEFAULT_KCAL_GOAL}" placeholder="1760"> kcal</div>
        <div class="config-field"><label>Meta de proteína diária</label><input type="number" id="fGoalProt" value="${config.protGoal||DEFAULT_PROT_GOAL}" placeholder="109"> g</div>
        <div class="config-field"><label>Meta de água</label><input type="number" id="fGoalWater" value="${config.waterGoalBottles||''}" placeholder="3"> garrafinhas (800ml)</div>
      </div>
      <p class="hint" style="margin-top:8px;">Meta calórica recalculada para seu peso atual (47,5kg, ~2,3g/kg proteína) · Água: 25–50 ml/kg/dia → ${waterMinL}–${waterMaxL} L para ${latestWeight}kg</p>
    </details>`;

    html += `<p class="group-label">Registro <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--teal);">— ${selDay.label}${isSelToday?' · hoje':''}, ${selDate.slice(8,10)}/${selDate.slice(5,7)}</span></p>
    <p class="hint" style="margin-top:-4px; margin-bottom:14px;">Essa aba mostra o mesmo dia selecionado na trilha lá em cima — troque de dia por ali, não só aqui.</p>`;

    if (!selEditable) {
      html += `<div class="rest-block"><p class="big">📅 esse dia ainda não chegou</p><p class="sub">Volte pra trilha e escolha hoje ou um dia que já passou pra registrar.</p></div>`;
    } else {
      html += `<div class="form-grid">
        <div class="field"><label>Peso (kg)</label><input type="number" step="0.1" id="fPeso" value="${today.peso||''}" placeholder="ex: 48.2"></div>
        <div class="field"><label>Sono (horas)</label><input type="number" step="0.5" min="0" max="14" id="fSono" value="${today.sono||''}" placeholder="ex: 7.5"></div>
        <div class="field"><label>Energia (1–5)</label><select id="fEnergia">
          <option value="">—</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${today.energia==n?'selected':''}>${n}</option>`).join('')}
        </select></div>
      </div>

      <details style="margin:12px 0 20px;">
        <summary>Ciclo, dores e outros detalhes (opcional)</summary>
        <div class="form-grid" style="margin-top:10px;">
          <div class="field"><label>Ciclo menstrual</label><select id="fCiclo">
            <option value="">—</option>
            <option value="regular" ${today.ciclo==='regular'?'selected':''}>regular</option>
            <option value="irregular" ${today.ciclo==='irregular'?'selected':''}>irregular esta semana</option>
          </select></div>
          <div class="field full"><label>Dores / desconfortos</label><input type="text" id="fDores" value="${today.dores||''}" placeholder="ex: nenhuma / leve na lombar"></div>
        </div>
      </details>

      <p class="hint" style="margin:-8px 0 20px;">O humor desse dia fica na aba "Treino e Humor" — cada carinha já registra na hora.</p>

      <p class="group-label">Água</p>
      <div class="water-row">
        <div class="bottles" id="bottles"></div>
        <span class="water-total" id="waterTotal"></span>
      </div>

      <p class="group-label">Alimentação</p>
      <div class="macro-summary">
        <div class="macro-item">
          <div class="macro-num">${todayKcal} <span class="macro-goal">/ ${goalKcal}</span></div>
          <div class="macro-lbl">kcal — energia do dia</div>
          <div class="kcal-progress-bar"><div class="kcal-progress-fill" style="width:${kcalPct}%"></div></div>
        </div>
        <div class="macro-item">
          <div class="macro-num">${Math.round(todayProt)}g <span class="macro-goal">/ ${goalProt}g</span></div>
          <div class="macro-lbl">proteína — material p/ o músculo</div>
          <div class="kcal-progress-bar"><div class="kcal-progress-fill" style="width:${protPct}%; background:var(--ochre);"></div></div>
        </div>
      </div>
      <div id="mealsWrap"></div>

      <div class="meal-card">
        <div class="meal-head"><span class="meal-title">Suplemento</span></div>
        <div class="item-row" style="border-bottom:none;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="fSuplemento" ${today.suplemento?'checked':''}>
            Multivitamínico — 1 dose (qualquer horário)
          </label>
        </div>
      </div>`;
    }

    html += `<details style="margin: 16px 0 4px;">
      <summary>Orientações da nutri</summary>
      <ul style="margin:10px 0 0; padding-left:18px; font-size:13px; color:var(--ink-soft); line-height:1.7;">
        ${ORIENTACOES.map(o=>`<li>${o}</li>`).join('')}
      </ul>
    </details>`;

    html += `<div class="entries"><p class="group-label" style="margin-top:24px;">Últimos registros</p><div id="entriesWrap"></div></div>`;
    html += `<div class="danger-zone"><button class="reset-link" id="btnReset">⚠ Limpar todos os registros salvos</button></div>`;

    contentEl.innerHTML = html;

    document.getElementById('rangeSemana').onclick = () => { panelRange = '7d'; render(); };
    document.getElementById('rangeMes').onclick = () => { panelRange = 'mes'; render(); };

    if (selEditable) {
      renderBottles(today, goalBottles, selDate);
      MEALS.forEach(m => renderMealCard(m, today, selDate));

      document.getElementById('fPeso').onchange = async (e) => { today.peso = e.target.value || null; await saveDay(selDate); toast(); render(); };
      document.getElementById('fSono').onchange = async (e) => { today.sono = e.target.value || null; await saveDay(selDate); toast(); };
      document.getElementById('fEnergia').onchange = async (e) => { today.energia = e.target.value || null; await saveDay(selDate); toast(); };
      document.getElementById('fCiclo').onchange = async (e) => { today.ciclo = e.target.value || null; await saveDay(selDate); toast(); };
      document.getElementById('fDores').onchange = async (e) => { today.dores = e.target.value || null; await saveDay(selDate); toast(); };
      document.getElementById('fSuplemento').onchange = async (e) => { today.suplemento = e.target.checked; await saveDay(selDate); toast(); };
    }
    renderEntries(dates);

    document.getElementById('fGoalKcal').onchange = async (e) => { config.calorieGoal = e.target.value; await saveConfig(); toast(); render(); };
    document.getElementById('fGoalProt').onchange = async (e) => { config.protGoal = e.target.value; await saveConfig(); toast(); render(); };
    document.getElementById('fGoalWater').onchange = async (e) => { config.waterGoalBottles = e.target.value; await saveConfig(); toast(); render(); };

    document.getElementById('btnReset').onclick = async () => {
      if (!confirm('Isso apaga todos os registros e configurações salvas neste navegador. Continuar?')) return;
      try {
        const l1 = await storage.list('status:', false);
        if (l1 && l1.keys) for (const k of l1.keys) { try { await storage.delete(k, false); } catch(e){} }
        const l2 = await storage.list('checkin:', false);
        if (l2 && l2.keys) for (const k of l2.keys) { try { await storage.delete(k, false); } catch(e){} }
        try { await storage.delete('config', false); } catch(e){}
      } catch(e){}
      statusMap = {}; checkins = {}; config = { calorieGoal:'', protGoal:'', waterGoalBottles:'3', corridaBaseKm:'', cycleLastStart:'', cycleLength:'28' };
      render();
    };
  }

  function renderBottles(today, goalBottles, dateForSave){
    const box = document.getElementById('bottles');
    const count = today.water.count || 0;
    const total = Math.max(goalBottles + 1, count + 1);
    box.innerHTML = '';
    for (let i=1; i<=total; i++){
      const b = document.createElement('button');
      b.className = 'bottle-btn' + (i<=count ? ' filled' : '');
      b.title = (i*0.8).toFixed(1)+' L';
      b.innerHTML = bottleSvg();
      b.onclick = async () => {
        today.water.count = (i === count) ? i-1 : i;
        await saveDay(dateForSave);
        toast();
        render();
      };
      box.appendChild(b);
    }
    document.getElementById('waterTotal').textContent = (count*0.8).toFixed(1) + ' L nesse dia (garrafinha de 800ml)';
  }


  // Sugestões iniciais por refeição (quando a busca está vazia) — o que faz sentido em cada momento do dia
  const MEAL_SUGGESTIONS = {
    pre: ['Shake pós-treino (whey+açaí+banana+morango+leite)','Whey Protein','Banana prata','Pão integral com mel','Café com leite','Aveia em flocos'],
    cafe: ['Ovo mexido/frito (pouco óleo)','Ovo cozido','Pão de forma integral','Pão integral com mel','Iogurte natural','Café com leite','Tapioca (goma hidratada)','Mamão','Banana prata','Queijo minas frescal'],
    pos: ['Whey Protein','Shake pós-treino (whey+açaí+banana+morango+leite)','Banana prata','Leite sem lactose','Pasta de amendoim','Iogurte grego natural'],
    almoco: ['Frango desfiado','Frango grelhado','Carne moída (patinho)','Arroz branco cozido','Feijão cozido','Salada verde','Batata doce cozida','Azeite extra virgem','Brócolis cozido','Macarrão cozido'],
    lanche: ['Iogurte natural','Granola','Pão integral com mel','Maçã fuji','Morango','Uva Rubi/Itália','Castanhas mistas','Pasta de amendoim','Queijo minas frescal','Whey Protein'],
    jantar: ['Carne moída (patinho)','Frango desfiado','Macarrão integral cozido','Arroz branco cozido','Salada verde','Tilápia grelhada','Batata doce cozida','Ovo cozido','Sopa de legumes','Peixe grelhado']
  };
  function defaultSuggestions(mealKey){
    const nomes = MEAL_SUGGESTIONS[mealKey] || [];
    const list = nomes.map(n => FOOD_BY_NAME[n]).filter(Boolean);
    return list.length ? list : FOOD_DB.slice(0,10);
  }

  function renderMealCard(m, today, dateForSave){
    const wrap = document.getElementById('mealsWrap');
    const entries = today.meals[m.key] || [];
    const kc = mealKcal(today, m.key);
    const pr = mealProt(today, m.key);
    const card = document.createElement('div');
    card.className = 'meal-card';

    const isSearchOpen = openSearchMeal === m.key;
    const q = normalize(searchQuery.trim());
    const results = isSearchOpen
      ? (q ? FOOD_DB.filter(f => normalize(f.n).includes(q)).slice(0,12) : defaultSuggestions(m.key))
      : [];

    card.innerHTML = `
      <div class="meal-head">
        <span class="meal-title">${m.label}</span>
        <span class="meal-kcal">${kc} kcal${pr>0 ? ` · ${pr.toFixed(0)}g prot` : ''}</span>
      </div>

      ${entries.length ? `<div class="item-list">${entries.map((e,i)=>{
        const f = FOOD_BY_NAME[e.n];
        const g = Math.round(toGrams(e));
        const qtyLabel = e.mode === 'un'
          ? `${e.qty} ${f ? f.unit + (e.qty>1?'s':'') : 'un'} <span class="conv">(${g}g)</span>`
          : `${g}g`;
        return `<div class="food-row">
          <div class="food-main">
            <span class="food-name">${e.n}</span>
            <span class="food-qty">${qtyLabel}</span>
          </div>
          <div class="food-macros">
            <span class="food-kcal">${entryKcal(e)}<span class="macro-unit">kcal</span></span>
            <span class="food-prot">${entryProt(e).toFixed(1)}<span class="macro-unit">g prot</span></span>
          </div>
          <button class="item-x meal-entry-x" data-meal="${m.key}" data-i="${i}" title="remover">×</button>
        </div>`;
      }).join('')}</div>` : `<p class="hint" style="margin:4px 0 10px;">Nada registrado nessa refeição ainda.</p>`}

      ${isSearchOpen ? `
        <div class="food-search">
          <input type="text" class="food-search-input" id="fSearch-${m.key}" placeholder="buscar alimento..." value="${searchQuery}" autocomplete="off">
          <div class="food-results">
            ${results.length ? results.map(f=>`
              <button class="food-result" data-meal="${m.key}" data-food="${f.n.replace(/"/g,'&quot;')}">
                <span class="fr-name">${f.n}</span>
                <span class="fr-info">${f.k100} kcal · ${f.p}g prot <span class="fr-per">/100g</span></span>
              </button>`).join('')
            : `<p class="hint" style="margin:8px 0;">Nenhum alimento encontrado com "${searchQuery}".</p>`}
          </div>
          <button class="search-cancel" data-meal="${m.key}">cancelar</button>
        </div>
      ` : `<button class="add-food-btn" data-meal="${m.key}">+ adicionar alimento</button>`}
    `;
    wrap.appendChild(card);

    // abrir busca
    const addBtn = card.querySelector('.add-food-btn');
    if (addBtn) addBtn.onclick = () => { openSearchMeal = m.key; searchQuery = ''; render(); };

    // cancelar busca
    const cancelBtn = card.querySelector('.search-cancel');
    if (cancelBtn) cancelBtn.onclick = () => { openSearchMeal = null; searchQuery = ''; render(); };

    // digitar na busca (sem re-render completo, pra não perder o foco do teclado)
    const searchInput = card.querySelector('.food-search-input');
    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        const qq = normalize(searchQuery.trim());
        const res = qq ? FOOD_DB.filter(f => normalize(f.n).includes(qq)).slice(0,12) : defaultSuggestions(m.key);
        const box = card.querySelector('.food-results');
        box.innerHTML = res.length ? res.map(f=>`
          <button class="food-result" data-meal="${m.key}" data-food="${f.n.replace(/"/g,'&quot;')}">
            <span class="fr-name">${f.n}</span>
            <span class="fr-info">${f.k100} kcal · ${f.p}g prot <span class="fr-per">/100g</span></span>
          </button>`).join('')
          : `<p class="hint" style="margin:8px 0;">Nenhum alimento encontrado.</p>`;
        bindResults();
      };
      setTimeout(()=> searchInput.focus(), 30);
    }

    function bindResults(){
      card.querySelectorAll('.food-result').forEach(btn => {
        btn.onclick = async () => {
          const nome = btn.dataset.food;
          const f = FOOD_BY_NAME[nome];
          if (!f) return;
          // entra já com 1 unidade caseira (o jeito mais natural de registrar sem pesar)
          today.meals[m.key].push({ n: nome, qty: 1, mode: 'un' });
          openSearchMeal = null;
          searchQuery = '';
          await saveDay(dateForSave);
          toast();
          render();
        };
      });
    }
    bindResults();

    // remover item
    card.querySelectorAll('.meal-entry-x').forEach(btn => {
      btn.onclick = async () => {
        today.meals[btn.dataset.meal].splice(parseInt(btn.dataset.i), 1);
        await saveDay(dateForSave);
        toast();
        render();
      };
    });

    // editar quantidade ao tocar no item
    card.querySelectorAll('.food-main').forEach((el, i) => {
      el.onclick = () => openQtyEditor(m.key, i, today, dateForSave);
    });
  }

  // Editor de quantidade — abre um mini-painel sobre o item
  function openQtyEditor(mealKey, idx, today, dateForSave){
    const e = today.meals[mealKey][idx];
    const f = FOOD_BY_NAME[e.n];
    if (!f) return;

    const overlay = document.createElement('div');
    overlay.className = 'qty-overlay';
    overlay.innerHTML = `
      <div class="qty-panel">
        <p class="qty-title">${e.n}</p>
        <p class="qty-sub">${f.k100} kcal · ${f.p}g proteína <span class="fr-per">por 100g</span></p>

        <div class="qty-row">
          <input type="number" step="any" min="0" id="qtyValue" value="${e.qty}">
          <select id="qtyMode">
            <option value="un" ${e.mode==='un'?'selected':''}>${f.unit}(s)</option>
            <option value="g" ${e.mode==='g'?'selected':''}>gramas</option>
          </select>
        </div>
        <p class="qty-hint" id="qtyPreview"></p>

        <div class="qty-actions">
          <button class="qty-cancel">cancelar</button>
          <button class="qty-save">salvar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const valEl = overlay.querySelector('#qtyValue');
    const modeEl = overlay.querySelector('#qtyMode');
    const prevEl = overlay.querySelector('#qtyPreview');

    function updatePreview(){
      const tmp = { n: e.n, qty: Math.max(0, parseFloat(valEl.value)||0), mode: modeEl.value };
      const g = Math.round(toGrams(tmp));
      prevEl.innerHTML = `<strong>${g}g</strong> na balança → <strong>${entryKcal(tmp)} kcal</strong> · <strong>${entryProt(tmp).toFixed(1)}g</strong> de proteína`;
    }
    updatePreview();
    valEl.oninput = updatePreview;
    modeEl.onchange = () => {
      // ao trocar de modo, converte o valor pra manter a mesma quantidade real
      const cur = { n: e.n, qty: Math.max(0, parseFloat(valEl.value)||0), mode: modeEl.value==='g' ? 'un' : 'g' };
      const grams = toGrams(cur);
      valEl.value = modeEl.value === 'g' ? Math.round(grams) : +(grams / f.unitG).toFixed(1);
      updatePreview();
    };

    overlay.querySelector('.qty-cancel').onclick = () => overlay.remove();
    overlay.onclick = (ev) => { if (ev.target === overlay) overlay.remove(); };
    overlay.querySelector('.qty-save').onclick = async () => {
      e.qty = Math.max(0, parseFloat(valEl.value) || 0);
      e.mode = modeEl.value;
      overlay.remove();
      await saveDay(dateForSave);
      toast();
      render();
    };
  }

  function renderEntries(datesRange){
    const box = document.getElementById('entriesWrap');
    const recent = datesRange.slice().reverse().filter(iso => checkins[iso]).slice(0,10);
    if (recent.length === 0) {
      box.innerHTML = `<p class="hint">Ainda sem registros neste período.</p>`;
      return;
    }
    box.innerHTML = recent.map(iso => {
      const c = getDay(iso);
      const st = statusMap[iso];
      const dotColor = st==='verde' ? 'var(--moss)' : st==='amarelo' ? 'var(--ochre)' : st==='vermelho' ? 'var(--brick)' : 'var(--line)';
      const dstr = iso.slice(8,10)+'/'+iso.slice(5,7);
      const kc = dayTotalKcal(c);
      const pr = dayTotalProt(c);
      const wl = c.water ? (c.water.count*0.8).toFixed(1) : '0.0';
      return `<div class="entry-row">
        <span class="d">${dstr}</span>
        <span class="entry-dot" style="background:${dotColor}"></span>
        <span>${c.peso? c.peso+'kg · ':''}${c.sono? c.sono+'h sono · ':''}${c.energia? 'energia '+c.energia+' · ':''}${kc>0? kc+'kcal · ':''}${pr>0? pr.toFixed(0)+'g prot · ':''}${wl}L${c.dores? ' · '+c.dores : ''}</span>
      </div>`;
    }).join('');
  }

  function render(){
    refreshToday();
    renderTrail();
    document.getElementById('tabPlano').classList.toggle('active', currentTab==='plano');
    document.getElementById('tabPainel').classList.toggle('active', currentTab==='painel');
    document.getElementById('tabDash').classList.toggle('active', currentTab==='dash');
    const cycleEl = document.getElementById('cycleInfo');
    if (currentTab === 'plano') {
      cycleEl.style.display = '';
      renderCycleBanner();
    } else {
      cycleEl.style.display = 'none';
    }
    if (currentTab === 'painel') {
      renderPainel();
    } else if (currentTab === 'dash') {
      renderDashboard();
    } else {
      renderDay(DIAS.find(d => d.key === currentDayKey));
    }
  }

  document.getElementById('tabPlano').onclick = () => { currentTab='plano'; openSearchMeal = null; searchQuery = ''; render(); };
  document.getElementById('tabPainel').onclick = () => { currentTab='painel'; openSearchMeal = null; searchQuery = ''; render(); };
  document.getElementById('tabDash').onclick = () => { currentTab='dash'; openSearchMeal = null; searchQuery = ''; render(); };

  // Se o app voltar de segundo plano (celular bloqueado, troca de app) num dia diferente, atualiza sozinho
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      const wasToday = todayISO;
      refreshToday();
      if (todayISO !== wasToday) {
        currentDayKey = TODAY_KEY;
      }
      render();
    }
  });

  loadAll();
})();
</script>
</body>
</html>
